name: Capture Farrago Signing Params

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: 1. 环境
        run: |
          echo "=== arch ==="; uname -m; sw_vers
          echo "=== tools ==="; which lldb clang python3 unzip
          echo "=== sudo ==="; sudo -n true && echo "sudo OK" || echo "sudo NO"
          echo "=== SIP ==="; csrutil status 2>&1 || true
          echo "=== VM ==="; sysctl -n kern.hv_vmm_present 2>/dev/null || true
          echo "=== files ==="; ls -la

      - name: 2. 解压
        run: |
          mkdir -p /tmp/kgrun
          unzip -q keygen.zip -d /tmp/kgrun
          APP=$(find /tmp/kgrun -maxdepth 2 -name "*.app" -type d | head -1)
          echo "APP=$APP"
          [ -z "$APP" ] && { echo "::error::no app"; exit 1; }
          xattr -cr "$APP" 2>/dev/null || true
          chmod +x "$APP"/Contents/MacOS/* 2>/dev/null || true
          lipo -info "$APP/Contents/MacOS/"* 2>&1 || file "$APP/Contents/MacOS/"*
          echo "APP_PATH=$APP" >> $GITHUB_ENV

      - name: 3. 编译 arm64
        run: |
          cp kg_trap2.m /tmp/kg_trap2.m
          clang -dynamiclib -arch arm64 -framework Foundation -framework AppKit \
            -O1 -D_XOPEN_SOURCE=700 -D_DARWIN_C_SOURCE \
            -o /tmp/trap.dylib /tmp/kg_trap2.m 2>&1 | head -20
          ls -la /tmp/trap.dylib 2>/dev/null && file /tmp/trap.dylib

      - name: 4. 验证能否 patch 代码页
        run: |
          cat > /tmp/mprot.c <<'EOF'
          #include <stdio.h>
          #include <sys/mman.h>
          #include <errno.h>
          #include <string.h>
          #include <mach/mach.h>
          int main(void) {
              void *p = (void*)0x100000000UL;
              vm_address_t page = (vm_address_t)p;
              kern_return_t kr = vm_protect(mach_task_self(), page, 4096, 0,
                                            VM_PROT_READ|VM_PROT_WRITE|VM_PROT_EXECUTE);
              printf("vm_protect kr=%d (%s)\n", kr, mach_error_string(kr));
              return 0;
          }
          EOF
          clang -o /tmp/mprot /tmp/mprot.c
          /tmp/mprot 2>&1 | head -3
          echo "--- 用真实模块测试 ---"
          cat > /tmp/mprot2.c <<'EOF'
          #include <stdio.h>
          #include <sys/mman.h>
          #include <errno.h>
          #include <string.h>
          #include <mach-o/dyld.h>
          #include <mach/mach.h>
          int main(void) {
              const struct mach_header_64 *h = (const struct mach_header_64 *)_dyld_get_image_header(0);
              void *text = (void*)((uintptr_t)h + 0x1000);
              vm_address_t page = (vm_address_t)text & ~0xFFFUL;
              kern_return_t kr = vm_protect(mach_task_self(), page, 4096, 0,
                                            VM_PROT_READ|VM_PROT_WRITE|VM_PROT_EXECUTE);
              printf("self __TEXT vm_protect kr=%d (%s)\n", kr, mach_error_string(kr));
              int r = mprotect((void*)page, 4096, PROT_READ|PROT_WRITE|PROT_EXEC);
              printf("self __TEXT mprotect=%d errno=%d (%s)\n", r, errno, strerror(errno));
              return 0;
          }
          EOF
          clang -o /tmp/mprot2 /tmp/mprot2.c 2>&1 | head -5
          /tmp/mprot2 2>&1 | head -5

      - name: 5. 跑采集器
        run: |
          LOG=/tmp/kg.log
          BIN="$APP_PATH/Contents/MacOS/CORE Keygen"
          DYLD_INSERT_LIBRARIES=/tmp/trap.dylib "$BIN" > "$LOG" 2>&1 &
          PID=$!
          for i in $(seq 1 40); do sleep 1; kill -0 $PID 2>/dev/null || break; done
          kill -9 $PID 2>/dev/null || true
          echo "=== [KG] ==="
          grep -E '\[KG\]|HIT|RESULT' "$LOG" || echo "(none)"
          echo "=== full log ==="
          head -80 "$LOG"

      - name: 6. 摘要
        if: always()
        run: |
          echo "===== 结果 ====="
          grep -E 'HIT|a0=|a1=|RESULT|>>>' /tmp/kg.log 2>/dev/null | head -30 || echo "(无)"